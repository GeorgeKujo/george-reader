<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14263f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GeorgeReader"><link rel="manifest" href="./manifest.webmanifest"><title>GeorgeReader</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark}body{margin:0;background:Canvas;color:CanvasText}header{background:#14263f;color:white;padding:calc(env(safe-area-inset-top) + 18px) 18px 20px}h1{margin:0;font-size:27px}main{max-width:760px;margin:auto;padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap}button,.action{border:0;border-radius:11px;background:#245c94;color:white;padding:11px 13px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#586474}button.danger{background:#8c3540}section{padding:15px 0;border-bottom:1px solid #9995}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #999;border-radius:10px;background:Canvas;color:CanvasText}label{display:block;margin:10px 0}ul{padding:0;list-style:none}li{padding:14px 0;border-bottom:1px solid #9995}li a{overflow-wrap:anywhere;color:LinkText}small,.muted{opacity:.7}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tools button{font-size:13px;padding:8px}.meta{font-size:12px;opacity:.7}</style></head><body><header><h1>GeorgeReader</h1><small>George Kujo — Personal Article Reader</small></header><main><nav><a class="action" href="https://agora-web.jp/" target="_blank" rel="noopener">アゴラ ↗</a><a class="action" href="https://news.yahoo.co.jp/" target="_blank" rel="noopener">Yahoo!ニュース ↗</a><a class="action" href="https://note.com/g_kujo_ir" target="_blank" rel="noopener">note ↗</a></nav><section><h2>記事を登録</h2><p class="muted">記事URLを貼り付けて保存します。本文は各媒体の公式ページで開きます。</p><form id="form"><label>記事URL<input id="url" type="url" required placeholder="https://..."></label><label>タイトル<input id="title" placeholder="記事タイトル"></label><label>媒体<select id="source"><option value="agora">アゴラ</option><option value="yahoo">Yahoo!ニュース</option><option value="note">note</option></select></label><button type="submit">登録する</button></form><p id="message" role="status"></p></section><section><h2>記事一覧 <span id="count"></span></h2><label>検索<input id="search" placeholder="タイトルやURLで検索"></label><label>媒体<select id="filter"><option value="all">すべて</option><option value="agora">アゴラ</option><option value="yahoo">Yahoo!ニュース</option><option value="note">note</option><option value="favorites">お気に入り</option><option value="unread">未読</option></select></label><ul id="items"></ul></section><section><h2>データ管理</h2><button class="secondary" id="export">JSONバックアップ</button> <label class="action" for="import">復元する</label><input id="import" type="file" accept="application/json" style="display:none"><p class="muted">保存内容はこの端末のブラウザ内に保持されます。ブラウザのデータ消去で失われる場合があります。</p></section><section><h2>ホーム画面に追加</h2><p>iPhoneのSafariで開き、「共有」→「ホーム画面に追加」を選んでください。</p><small>非公式の個人用リンク管理アプリです。外部記事の転載・自動収集は行いません。</small></section></main><script>const KEY='george-reader-v03';const $=id=>document.getElementById(id);let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{}const domains={agora:['agora-web.jp'],yahoo:['news.yahoo.co.jp'],note:['note.com']};function valid(url,source){try{const u=new URL(url);return u.protocol==='https:'&&domains[source].some(d=>u.hostname===d||u.hostname.endsWith('.'+d))}catch{return false}}function persist(){localStorage.setItem(KEY,JSON.stringify(entries));render()}function render(){const list=$('items');list.replaceChildren();const q=$('search').value.toLowerCase(),f=$('filter').value;const shown=entries.filter(x=>(f==='all'||x.source===f||f==='favorites'&&x.favorite||f==='unread'&&!x.read)&&(x.title+' '+x.url).toLowerCase().includes(q));$('count').textContent='('+shown.length+'/'+entries.length+')';for(const item of shown){const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('div'),tools=document.createElement('div');a.href=item.url;a.target='_blank';a.rel='noopener';a.textContent=item.title||item.url;a.onclick=()=>{item.read=true;persist()};meta.className='meta';meta.textContent=({agora:'アゴラ',yahoo:'Yahoo!ニュース',note:'note'})[item.source]+' · '+(item.read?'既読':'未読')+(item.favorite?' · ★':'');tools.className='tools';for(const [label,act,cls] of [[item.read?'未読にする':'既読にする',()=>{item.read=!item.read;persist()},'secondary'],[item.favorite?'★解除':'☆お気に入り',()=>{item.favorite=!item.favorite;persist()},'secondary'],['削除',()=>{if(confirm('この記事を削除しますか？')){entries=entries.filter(x=>x.url!==item.url);persist()}},'danger']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=act;tools.append(b)}li.append(a,meta,tools);list.append(li)}if(!shown.length){const li=document.createElement('li');li.textContent='該当する記事はありません';list.append(li)}}$('form').onsubmit=e=>{e.preventDefault();const url=$('url').value.trim(),title=$('title').value.trim(),source=$('source').value;if(!valid(url,source)){$('message').textContent='選択した媒体のHTTPS記事URLを入力してください';return}if(entries.some(x=>x.url===url)){$('message').textContent='登録済みです';return}entries.unshift({url,title,source,read:false,favorite:false,added:new Date().toISOString()});persist();$('form').reset();$('message').textContent='登録しました'};$('search').oninput=render;$('filter').onchange=render;$('export').onclick=()=>{const b=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='george-reader-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error();const good=data.filter(x=>x&&domains[x.source]&&valid(x.url,x.source)).map(x=>({url:x.url,title:typeof x.title==='string'?x.title.slice(0,250):'',source:x.source,read:!!x.read,favorite:!!x.favorite,added:typeof x.added==='string'?x.added:''}));entries=[...good,...entries].filter((x,i,a)=>a.findIndex(y=>y.url===x.url)===i);persist();$('message').textContent=good.length+'件読み込みました'}catch{$('message').textContent='読み込みに失敗しました'}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
